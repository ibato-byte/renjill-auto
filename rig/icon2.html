<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#FBF4EA 0%,#EEDFCB 70%,#E4D0B6 100%)}
.ic svg{position:absolute}
</style></head><body>
<div class="ic" id="A"><svg id="ar" viewBox="0 0 400 420" style="width:860px;height:903px;left:-40px;top:70px"></svg><svg id="aj" viewBox="0 0 400 420" style="width:640px;height:672px;left:420px;top:330px"></svg></div>
<div class="ic" id="C"><svg id="cr" viewBox="0 0 400 420" style="width:900px;height:945px;left:-50px;top:-30px"></svg><svg id="cj" viewBox="0 0 400 420" style="width:690px;height:725px;left:410px;top:250px"></svg></div>
<div class="ic" id="B"><svg id="br" viewBox="0 0 400 420" style="width:980px;height:1029px;left:-130px;top:40px"></svg><svg id="bj" viewBox="0 0 400 420" style="width:720px;height:756px;left:400px;top:300px"></svg></div>
<script src="rig.js"></script><script>
for (const [r,j] of [['ar','aj'],['br','bj'],['cr','cj']]) {
RIG.render(document.getElementById(r),Object.assign({char:'ren',id:r},RIG.FACES.smile,{earL:6,earR:6}));
RIG.render(document.getElementById(j),Object.assign({char:'jil',id:j,flip:false},RIG.FACES.neutral,{headTilt:-4}));}
</script></body></html>
