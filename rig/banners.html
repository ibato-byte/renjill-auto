<!doctype html><html><head><meta charset="utf-8">

<style>

.b{position:relative;overflow:hidden;background:linear-gradient(180deg,#F6EFE4 0%,#F3E8D8 68%,#E4D2B8 68%,#DCC7A8 100%)}
.win{position:absolute;background:linear-gradient(180deg,#DCEBF5,#EEF5F9);border:10px solid #FBF7F0;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.05)}

.plant{position:absolute;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 40% 35%,#9DB886,#6E8F5B)}
.pot{position:absolute;background:#C9962F;border-radius:4px 4px 10px 10px}
.title{position:absolute;font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;font-weight:900;color:#3B2E22;letter-spacing:.04em;line-height:1}
.sub{position:absolute;font-family:'Outfit','Noto Sans CJK JP','Noto Sans',sans-serif;font-weight:600;color:#7A6550;letter-spacing:.12em}
.duo{position:absolute;display:flex;align-items:flex-end}
.dot{position:absolute;border-radius:50%;background:#C9962F;opacity:.18}
