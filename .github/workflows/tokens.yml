name: tokens
on:
  schedule:
    - cron: "0 21 * * *"  # 毎日 6:00 JST（Hub の指示 #5：毎日・残り14日で要対応・使えなくなったらその日のうちにメール）
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check token-health
      - uses: actions/checkout@v4
        if: steps.hub.outputs.paused != 'true'
      - uses: actions/setup-python@v5
        if: steps.hub.outputs.paused != 'true'
        with: { python-version: "3.12" }
      - if: steps.hub.outputs.paused != 'true'
        run: pip install -q requests
      - name: トークンの確認
        if: steps.hub.outputs.paused != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}  # 一致するかを見るだけ（ページ ID はコードの 1358515160686321 を使う）
        run: python auto/token_check.py
      - name: トークンの警告をメールで知らせる（同じ内容は1日1通まで）
        if: always() && steps.hub.outputs.paused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python auto/alerts.py send || true
      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=()
          [ -f dist/token_check_args ] && mapfile -d '' extra < dist/token_check_args
          # 失敗したときは gha.sh が「修正」の依頼を自動で作る（人に頼まない）
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report token-health "$JOB_STATUS" "$PAUSED" "Instagram・Facebook・YouTube・GitHub のトークンを確認（結果は下の数値とやること）" \
            --next-run-at "$(bash "$RUNNER_TEMP/hub/scripts/gha.sh" next-daily 21:00)" "${extra[@]}"
