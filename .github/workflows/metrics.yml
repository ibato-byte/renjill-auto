name: metrics
on:
  schedule:
    - cron: "30 21 * * *"  # 06:30 JST（週次PDCAの前に最新化）
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: post  # posted.json（予約した回の投稿ID）を書くので、投稿と同時に動かさない
jobs:
  metrics:
    # 投稿用のキー（Secrets）を登録し、Settings → Variables で AUTO_POST_ENABLED=true にするまで動かない
    if: vars.AUTO_POST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check renjill-metrics
      - uses: actions/checkout@v5
        if: steps.hub.outputs.paused != 'true'
        with: { ref: main }  # 待たされた実行が古い posted.json で上書きしないよう最新の main を取る（11/8 の二重投稿の再発防止）
      - uses: actions/setup-python@v6
        if: steps.hub.outputs.paused != 'true'
        with: { python-version: "3.12" }
      - if: steps.hub.outputs.paused != 'true'
        run: pip install -q requests google-api-python-client google-auth google-auth-httplib2
      - if: steps.hub.outputs.paused != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python auto/metrics.py
      - name: 取りこぼしていた数字（保存・シェア・リーチ・視聴時間・プロフィール訪問・ストーリーズ・Facebook）を集める（Claude を使わない。依頼 #95）
        if: steps.hub.outputs.paused != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python auto/insights.py || true
      - name: その日の話題の確認（Claude を使わない。使える話題がある日だけ候補を積む。依頼 #38）
        if: steps.hub.outputs.paused != 'true'
        run: python auto/topics.py || true
      - if: steps.hub.outputs.paused != 'true'
        run: |
          git config user.name renjill-bot; git config user.email bot@renjill.local
          git add content/metrics.csv content/followers.csv content/insights.csv auto/posted.json auto/topic_queue.json; git diff --cached --quiet || git commit -m "metrics: $(TZ=Asia/Tokyo date '+%Y-%m-%d')"; bash auto/push_main.sh
      - name: トークンの警告をメールで知らせる（同じ内容は1日1通まで）
        if: always() && steps.hub.outputs.paused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python auto/alerts.py send || true
      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=()
          [ -f dist/metrics_hub_args ] && mapfile -d '' extra < dist/metrics_hub_args
          # 途中で止まって結果のファイルがないときも、Hub の「やること」に出す
          if [ "$JOB_STATUS" != success ] && [ "$PAUSED" != true ] && [ ${#extra[@]} -eq 0 ]; then
            extra=(--owner-action "途中で止まった（$(TZ=Asia/Tokyo date +%m/%d) の実行）。Hub の「前回の結果」のリンクから実行のログを開き、赤い行を Claude に送って相談する")
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report renjill-metrics "$JOB_STATUS" "$PAUSED" "各SNSの再生・保存・シェアなどを content/metrics.csv に、フォロワー数を content/followers.csv に記録（Instagram・Facebook は Graph API のインサイト）" \
            --does "毎日、各 SNS の再生数・フォロワー数などを集めて記録する" --outcome done \
            --next-run-at "$(bash "$RUNNER_TEMP/hub/scripts/gha.sh" next-daily 21:30)" "${extra[@]}"
