name: post
on:
  schedule:
    - cron: "0 3 * * *"   # 12:00 JST
    - cron: "0 9 * * *"   # 18:00 JST
    - cron: "0 10 * * *"  # 19:00 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "強制実行するスロット（例 12:00）。空なら現在時刻で判定"
        required: false
permissions:
  contents: write
concurrency: post
jobs:
  post:
    # 投稿用のキー（Secrets）を登録し、Settings → Variables で AUTO_POST_ENABLED=true にするまで動かない
    if: vars.AUTO_POST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: npm i -g playwright && npx playwright install --with-deps chromium
      - run: pip install -q requests numpy scipy google-api-python-client google-auth google-auth-httplib2
      - name: post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: python auto/post.py ${{ github.event.inputs.slot }}
      - name: commit results
        if: always()
        run: |
          git config user.name renjill-bot; git config user.email bot@renjill.local
          git add -A auto/posted.json dist/*.jpg dist/*.json || true
          git diff --cached --quiet || git commit -m "post: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
