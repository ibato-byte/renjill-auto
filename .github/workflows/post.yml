name: post
on:
  schedule:
    - cron: "0 3 * * *"   # 12:00 JST
    - cron: "0 9 * * *"   # 18:00 JST
    - cron: "0 10 * * *"  # 19:00 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "強制実行するスロット（例 12:00）。空なら現在時刻で判定"
        required: false
      date:
        description: "出し直す日（例 2026-10-23。トークン復旧後に、出せなかった回を出す）。slot と一緒に指定。投稿済みの SNS は posted.json を見て飛ばす"
        required: false
permissions:
  contents: write
  issues: write
concurrency: post
jobs:
  post:
    # 投稿用のキー（Secrets）を登録し、Settings → Variables で AUTO_POST_ENABLED=true にするまで動かない
    if: vars.AUTO_POST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check renjill-post
      - uses: actions/checkout@v5
        if: steps.hub.outputs.paused != 'true'
      - uses: actions/setup-node@v5
        if: steps.hub.outputs.paused != 'true'
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        if: steps.hub.outputs.paused != 'true'
        with: { python-version: "3.12" }
      - if: steps.hub.outputs.paused != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - if: steps.hub.outputs.paused != 'true'
        run: npm i -g playwright && npx playwright install --with-deps chromium
      - if: steps.hub.outputs.paused != 'true'
        run: pip install -q requests numpy scipy google-api-python-client google-auth google-auth-httplib2
      - name: post
        if: steps.hub.outputs.paused != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          rm -f dist/post_hub_args  # 前の実行の結果を Hub に出さない
          # 出し直し（date を指定）：その日の回のうち、まだ出ていない SNS だけを出す（posted.json で二重投稿を防ぐ）
          if [ -n "$IN_DATE" ]; then python auto/post.py --date "$IN_DATE" "${IN_SLOT:-12:00}"; else python auto/post.py $IN_SLOT; fi
      - name: トークンの警告をメールで知らせる（同じ内容は1日1通まで）
        if: always() && steps.hub.outputs.paused != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python auto/alerts.py send || true
      - name: commit results
        if: always() && steps.hub.outputs.paused != 'true'
        run: |
          git config user.name renjill-bot; git config user.email bot@renjill.local
          git add -A auto/posted.json dist/*.jpg dist/*.json || true
          git diff --cached --quiet || git commit -m "post: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          bash auto/push_main.sh
      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=()
          [ -f dist/post_hub_args ] && mapfile -d '' extra < dist/post_hub_args
          # 途中で止まって結果のファイルがないときも、Hub の「やること」に出す
          if [ "$JOB_STATUS" != success ] && [ "$PAUSED" != true ] && [ ${#extra[@]} -eq 0 ]; then
            extra=(--owner-action "途中で止まった（$(TZ=Asia/Tokyo date +%m/%d) の実行）。Hub の「前回の結果」のリンクから実行のログを開き、赤い行を Claude に送って相談する")
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report renjill-post "$JOB_STATUS" "$PAUSED" "予定の回を自動で投稿（Instagram・Facebook は Meta Graph API。投稿済み・Business Suite で予約済みは auto/posted.json で飛ばす）" \
            --next-run-at "$(bash "$RUNNER_TEMP/hub/scripts/gha.sh" next-daily 03:00 09:00 10:00)" \
            "${extra[@]}"
