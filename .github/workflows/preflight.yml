name: preflight
on:
  schedule:
    - cron: "0 21 * * *"  # 06:00 JST 毎日：3日以内に投稿する回を先に描画・QA
  push:
    paths: ["rig/**", "auto/schedule.json"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: post
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check renjill-preflight
      - uses: actions/checkout@v5
        if: steps.hub.outputs.paused != 'true'
      - uses: actions/setup-node@v5
        if: steps.hub.outputs.paused != 'true'
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        if: steps.hub.outputs.paused != 'true'
        with: { python-version: "3.12" }
      - if: steps.hub.outputs.paused != 'true'
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            # 2026-11-07：取得が止まり15分枠で打ち切られたため、2回目からは別のミラーで取り直す（枠は20分）
            if [ "$i" -ge 2 ]; then sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true; fi
            timeout 300 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk' && exit 0
            echo "準備をやり直す（$i回目）"; sleep 10
          done
          exit 1
      - if: steps.hub.outputs.paused != 'true'
        run: npm i -g playwright && npx playwright install --with-deps chromium
      - if: steps.hub.outputs.paused != 'true'
        run: pip install -q requests numpy scipy
      - id: qa
        if: steps.hub.outputs.paused != 'true'
        run: python auto/preflight.py
        continue-on-error: true
      - id: tests
        name: 全テストの実行（1件でも落ちたら失敗にして「あなたの番」に出す。Hub 依頼 #125）
        if: steps.hub.outputs.paused != 'true'
        run: python -m unittest discover -s tests 2>&1 | tail -40; test ${PIPESTATUS[0]} -eq 0
        shell: bash
        continue-on-error: true
      - name: 手で予約した TikTok・YouTube の文言のずれを調べる
        if: steps.hub.outputs.paused != 'true'
        run: python auto/driftcheck.py || true
      - name: commit renders and QA reports
        if: steps.hub.outputs.paused != 'true'
        run: |
          git config user.name renjill-bot; git config user.email bot@renjill.local
          git add -A dist/ || true
          git diff --cached --quiet || git commit -m "preflight: $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          bash auto/push_main.sh
      - name: テストが落ちたら失敗にする
        if: steps.tests.outcome == 'failure'
        run: echo "テストが1件以上失敗している（この実行のログの「全テストの実行」を見る）"; exit 1
      - name: open issue on QA failure
        if: steps.qa.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          body=$(for f in dist/*_qa.json; do python3 -c "import json,sys;d=json.load(open('$f'));print('### '+d['ep']+(' ✅' if d['pass'] else ' ❌'));[print('- '+i) for i in d['issues']]"; done)
          gh label create qa --color D93F0B --force || true
          gh issue create --title "動画QA NG $(TZ=Asia/Tokyo date '+%Y-%m-%d')" --body "$body" --label qa || true
          exit 1
      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=(--owner-action none)
          if [ -f dist/drift_hub_args ]; then mapfile -d '' -t extra < dist/drift_hub_args; fi
          if [ "$TESTS" = "failure" ]; then extra=(--owner-action "renjill-auto の自動テストが1件以上落ちている。投稿の仕組みのどこかが壊れている。Claude に「renjill-auto のテストが落ちているので直して」と伝える"); fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report renjill-preflight "$JOB_STATUS" "$PAUSED" "3日以内に投稿する回を事前に描画し、QA に合格" \
            --does "毎日、3日以内に投稿する回を事前に描画し、品質チェック（QA）に通るか確かめる" --outcome done \
            --next-run-at "$(bash "$RUNNER_TEMP/hub/scripts/gha.sh" next-daily 21:00)" "${extra[@]}"
