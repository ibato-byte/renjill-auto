name: manual
# 手動予約モード（auto/mode.json）：Instagram・Facebook は API で投稿せず、オーナーの iMac の Chrome で動く Claude
# （スケジュールタスク「レンとジル Business Suite 自動予約」月・火 10:47／16:47）が Meta Business Suite に予約する。
# その素材（mp4・カバー・投稿文・manifest.json）を作って非公開の成果物 manual-YYYYMMDD（7日）にし、
# manifest に入れた回を posted.json に bs-scheduled と記録する（二重予約の防止）。
# API は呼ばない・投稿しない・mp4 はコミットしない。完全自動に戻す手順：docs/setup/manual-mode.md
on:
  schedule:
    - cron: "30 0 * * 1"  # 毎週月曜 9:30 JST（保険。週次PDCA の push で先に動いていれば同じ中身を作り直すだけ）
  push:
    branches: [main]
    paths: ["auto/schedule.json"]  # 週次PDCA が回を足したとき（月曜 10:00 までに成功した実行があるように）
  workflow_dispatch:
    inputs:
      scheduled:
        description: "手で予約した回（スペース区切り。例 papers2 mug2）。posted.json に manual と記録して、残りだけ作り直す"
        required: false
permissions:
  contents: write
concurrency: post
jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Automation Hub：一時停止の確認
        id: hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check renjill-manual
      - uses: actions/checkout@v4
        if: steps.hub.outputs.paused != 'true'
      - uses: actions/setup-node@v4
        if: steps.hub.outputs.paused != 'true'
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        if: steps.hub.outputs.paused != 'true'
        with: { python-version: "3.12" }
      - if: steps.hub.outputs.paused != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - if: steps.hub.outputs.paused != 'true'
        run: npm i -g playwright && npx playwright install --with-deps chromium
      - if: steps.hub.outputs.paused != 'true'
        run: pip install -q requests numpy scipy
      - name: 名前（manual-YYYYMMDD）
        id: name
        run: echo "name=manual-$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: 素材を作る（予約済みの記録も）
        if: steps.hub.outputs.paused != 'true'
        env:
          SCHEDULED: ${{ inputs.scheduled }}
          ARTIFACT_NAME: ${{ steps.name.outputs.name }}
        run: |
          set -- "$RUNNER_TEMP/manual"
          [ -n "$SCHEDULED" ] && set -- "$@" --mark "$SCHEDULED"
          python auto/manual_pack.py "$@"
      - name: 予約の記録（bs-scheduled・manual）をコミット
        if: always() && steps.hub.outputs.paused != 'true'
        run: |
          git config user.name renjill-bot; git config user.email bot@renjill.local
          git add auto/posted.json
          git diff --cached --quiet || { git commit -m "manual: 予約の記録（${{ steps.name.outputs.name }}）"; git pull -q --rebase && git push; }
      - name: 成果物にする（保存期間7日）
        if: always() && steps.hub.outputs.paused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/manual/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - name: Automation Hub に記録
        if: always()
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=()
          [ -f dist/manual_hub_args ] && mapfile -d '' extra < dist/manual_hub_args
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report renjill-manual "$JOB_STATUS" "$PAUSED" "Business Suite に予約する素材と manifest.json を作った（成果物 ${{ steps.name.outputs.name }}）" \
            --next-run-at "$(date -u -d "next monday 00:30" +%Y-%m-%dT%H:%M:00Z)" "${extra[@]}"
